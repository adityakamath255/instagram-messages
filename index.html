<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram messages</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "core.py": { url: "./core.py" },
            ".streamlit/config.toml": { url: "./.streamlit/config.toml" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
